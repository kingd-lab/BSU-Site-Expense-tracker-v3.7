<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  // Applied before first paint to avoid a flash of the wrong theme.
  (function () {
    var stored = localStorage.getItem('sems_theme');
    var theme = stored || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excavation of Trenches — Site Expense Manager</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/forms.css">
<script src="js/chart-loader.js"></script>
</head>
<body>

<template id="pageContent">
  <div class="mobile-topbar">
    <button id="menuBtn"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <strong>Site Expense</strong>
    <span></span>
  </div>

  <div class="topbar">
    <div>
      <h1>Excavation of Trenches</h1>
      <div class="sub">Columns achieved over time, and cost-per-column against actual Excavation spend</div>
    </div>
    <button class="btn btn-primary" id="addEntryBtn" style="display:none;">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg> Log Columns Achieved
    </button>
  </div>

  <div class="stat-grid">
    <div class="stat-card">
      <div class="label"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V10l7-6 7 6v11"/><path d="M10 21v-6h4v6"/></svg> Columns Achieved</div>
      <div class="value primary" id="statColumns">—</div>
    </div>
    <div class="stat-card">
      <div class="label"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg> Excavation Cost</div>
      <div class="value" id="statCost">—</div>
    </div>
    <div class="stat-card">
      <div class="label"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-7 4 14 2-7h6"/></svg> Avg Cost / Column</div>
      <div class="value accent" id="statCostPerColumn">—</div>
    </div>
  </div>

  <div id="addEntryForm" class="card" style="display:none;">
    <div class="card-head"><h3>Log Progress</h3></div>
    <div class="form-grid">
      <div class="field"><label>Date</label><input type="date" id="entryDate"></div>
      <div class="field" id="entrySiteField"><label>Site</label><select id="entrySite"><option value="">Select a site…</option></select></div>
      <div class="field"><label>Columns Achieved</label><input type="number" id="entryColumns" min="0" placeholder="e.g. 12"></div>
      <div class="field span-2"><label>Notes (optional)</label><input type="text" id="entryNotes" placeholder="e.g. digging + casting, 3 double columns"></div>
    </div>
    <div class="field-hint" style="margin-bottom:14px;">
      This just logs progress — it doesn't post a cost by itself. Log the actual spend separately on
      <strong>Add Expense</strong> under "Excavation of Trenches," "Excavation Equipment Hire," or any "Concrete Works" category,
      and it'll be picked up automatically in the cost-per-column figure above.
    </div>
    <div class="form-actions">
      <button class="btn btn-ghost" id="cancelAddEntry">Cancel</button>
      <button class="btn btn-primary" id="saveEntryBtn">Save Entry</button>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h3>Progress Trend</h3></div>
    <div class="chart-box"><canvas id="trendChart"></canvas></div>
  </div>

  <div class="card">
    <div class="card-head"><h3>Progress Log</h3></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Date</th><th>Site</th><th>Columns Achieved</th><th>Running Total</th><th>Notes</th><th>Logged By</th></tr>
        </thead>
        <tbody id="entryRows"></tbody>
      </table>
    </div>
    <div class="empty-state" id="emptyState" style="display:none;">
      <div class="icon"><svg class="ico ico-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V10l7-6 7 6v11"/><path d="M10 21v-6h4v6"/></svg></div>
      <div>No progress logged yet.</div>
    </div>
  </div>
</template>

<div class="toast" id="toast"></div>

<script src="js/theme.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/excavation-tracker.js"></script>
</body>
</html>
