<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  (function () {
    var stored = localStorage.getItem('sems_theme');
    var theme = stored || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cash Book — Site Expense Manager</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/forms.css">
</head>
<body>

<template id="pageContent">
  <div class="mobile-topbar">
    <button id="menuBtn"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <strong>Site Expense</strong>
    <span></span>
  </div>

  <div class="topbar">
    <div>
      <h1>Cash Book</h1>
      <div class="sub">Running-balance ledger — Money Out lines auto-post to Expenses. Admin only.</div>
    </div>
  </div>

  <div class="card" id="lastEntryCard" style="display:none;">
    <div class="card-head"><h3>Last Entry Logged</h3></div>
    <div class="preview-box">
      <div class="preview-row"><span>Date</span><strong id="lastEntryDate">\u2014</strong></div>
      <div class="preview-row"><span>Description</span><strong id="lastEntryDesc">\u2014</strong></div>
      <div class="preview-row"><span>Amount</span><strong id="lastEntryAmount">\u2014</strong></div>
      <div class="preview-row total"><span>Balance after this entry</span><strong id="lastEntryBalance">\u2014</strong></div>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat-card">
      <div class="label">Total Received</div>
      <div class="value primary" id="statTotalIn">₦0</div>
    </div>
    <div class="stat-card">
      <div class="label">Total Spent</div>
      <div class="value" id="statTotalOut">₦0</div>
    </div>
    <div class="stat-card">
      <div class="label">Current Balance</div>
      <div class="value accent" id="statBalance">₦0</div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h3>New Entry</h3></div>
    <form id="cashBookForm" class="form-grid">
      <div class="field">
        <label for="cbDate">Date <span style="font-weight:400;color:var(--color-ink-muted);">(leave blank to continue previous date)</span></label>
        <input type="date" id="cbDate">
      </div>
      <div class="field">
        <label for="cbSite">Site</label>
        <select id="cbSite"></select>
      </div>
      <div class="field" style="grid-column: 1 / -1;">
        <label for="cbDescription">Description</label>
        <input type="text" id="cbDescription" placeholder="e.g. USMAN block production" required>
      </div>
      <div class="field">
        <label for="cbMoneyOut">Money Out (Debit)</label>
        <input type="number" id="cbMoneyOut" min="0" step="1" placeholder="0">
      </div>
      <div class="field">
        <label for="cbMoneyIn">Money In (Credit)</label>
        <input type="number" id="cbMoneyIn" min="0" step="1" placeholder="0">
      </div>
      <div class="field" style="grid-column: 1 / -1;">
        <label for="cbCategory">Category <span style="font-weight:400;color:var(--color-ink-muted);">(auto-suggested for Money Out — override if wrong)</span></label>
        <select id="cbCategory"></select>
      </div>
      <div style="grid-column: 1 / -1; display:flex; gap:10px;">
        <button type="submit" class="btn btn-primary" id="cbSubmitBtn">Add Entry</button>
        <span id="cbHint" style="font-size:12.5px;color:var(--color-ink-muted);align-self:center;"></span>
      </div>
    </form>
  </div>

  <div class="card">
    <div class="card-head">
      <h3>Ledger</h3>
      <div class="sub" id="ledgerMeta" style="font-size:12.5px;color:var(--color-ink-muted);"></div>
    </div>
    <div class="table-wrap">
      <table id="cashBookTable">
        <thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Money Out</th><th>Money In</th><th>Balance</th><th></th></tr></thead>
        <tbody id="cashBookRows"></tbody>
      </table>
      <div class="empty-state" id="cashBookEmpty" style="display:none;">No Cash Book entries yet — add your first one above.</div>
    </div>
  </div>
</template>

<div class="toast" id="toast"></div>

<script src="js/theme.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/categories.js"></script>
<script src="js/cash-book.js"></script>
</body>
</html>
